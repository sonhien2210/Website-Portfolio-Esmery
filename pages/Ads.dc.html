<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/redaction" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--body); font-family: var(--font-body); }
    a { color: var(--tag); text-decoration: none; transition: color .18s ease; }
    a:hover { color: var(--text); }
    ::selection { background: var(--deep); color: var(--text); }
    button:focus-visible, a:focus-visible { outline: 1px solid var(--line); outline-offset: 3px; }
    .wwd-card .wwd-visual { transition: transform .7s cubic-bezier(.2,.6,.2,1); }
    .wwd-card:hover .wwd-visual { transform: scale(1.035); }
    .wwd-card .wwd-cta { opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .35s ease; }
    .wwd-card:hover .wwd-cta { opacity: 1; transform: translateY(0); }
      body { --bg:#ffffff; --logo-filter:none; --card:#f2f2f3; --deep:#e4e4e5; --text:#17191c; --body:#777b86; --tag:#979799; --faint:#a3a6af; --line:#17191c; --card-line:transparent; --hair:#ececec; --grad:rgba(255,255,255,0.9); --btn-bg:#17191c; --btn-text:#ffffff; --btn-hover:#000000; --ghost-r:9999px; --nav-bg:rgba(255,255,255,0.8); --backdrop:rgba(23,25,28,0.45); --modal-bg:#ffffff; --modal-line:transparent; --footer-line:#ececec; --footer-bg:#fafafb; --font-display:'Source Serif 4', serif; --font-display-em:'Source Serif 4', serif; --font-body:'Inter', ui-sans-serif, system-ui, sans-serif; --shadow-artifact:0 0 0 1px rgba(4,23,43,0.05), 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); --spark-a:#5d2a1a; --chart-a:#a3a6af; --chart-b:#5d2a1a; --delta:#5d2a1a; --pill-line:#979799; --pill-text:#17191c; }
    body[data-esm-theme="dark"] { --bg:#000000; --logo-filter:invert(1); --card:#191919; --deep:#303030; --text:#eeeeee; --body:#b4b4b4; --tag:#7b7b7b; --faint:#606060; --line:#b4b4b4; --card-line:#b4b4b4; --hair:#303030; --grad:rgba(0,0,0,0.72); --btn-bg:#eeeeee; --btn-text:#050505; --btn-hover:#ffffff; --ghost-r:10px; --nav-bg:rgba(0,0,0,0.65); --backdrop:rgba(0,0,0,0.82); --modal-bg:#191919; --modal-line:#b4b4b4; --footer-line:#606060; --footer-bg:transparent; --font-display:'Redaction 10', serif; --font-display-em:'Redaction 50', serif; --font-body:'Geist', sans-serif; --shadow-artifact:none; --spark-a:#fbe1d1; --chart-a:#b4b4b4; --chart-b:#fbe1d1; --delta:#fbe1d1; --pill-line:#b4b4b4; --pill-text:#b4b4b4; }
    @keyframes esm-liq-en { 0% { transform: translateX(0) scaleX(1) scaleY(1); } 28% { transform: translateX(9px) scaleX(1.42) scaleY(0.90); } 62% { transform: translateX(40px) scaleX(1.22) scaleY(0.93); } 86% { transform: translateX(46px) scaleX(0.965) scaleY(1.015); } 100% { transform: translateX(46px) scaleX(1) scaleY(1); } }
    @keyframes esm-liq-vi { 0% { transform: translateX(46px) scaleX(1) scaleY(1); } 28% { transform: translateX(37px) scaleX(1.42) scaleY(0.90); } 62% { transform: translateX(6px) scaleX(1.22) scaleY(0.93); } 86% { transform: translateX(0) scaleX(0.965) scaleY(1.015); } 100% { transform: translateX(0) scaleX(1) scaleY(1); } }
  </style>
</helmet>

<nav style="position:sticky; top:0; z-index:50; background:var(--nav-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);">
  <div style="max-width:1280px; margin:0 auto; height:72px; padding:0 32px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px;">
    <a href="Home.dc.html" style="display:inline-flex; align-items:center;"><img src="uploads/bf517465-2789-4e72-8f3b-91faeedda607.png" alt="Esmery" style="height:32px; width:auto; filter:var(--logo-filter);"></a>
    <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" style="border:1px solid var(--line); background:transparent; color:var(--text); border-radius:9999px; width:34px; height:34px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-family:var(--font-body); padding:0; justify-self:center;">{{ themeIcon }}</button>
    <div style="display:flex; align-items:center; gap:12px; justify-self:end;">
      <button onClick="{{ toggleLang }}" aria-label="{{ langToggleLabel }}" style="position:relative; display:flex; align-items:center; border:1px solid var(--line); border-radius:9999px; padding:2px; gap:2px; background:transparent; cursor:pointer; transition:border-color .25s ease, background-color .25s ease;" style-hover="border-color:var(--text); background:var(--card);">
        <span aria-hidden="true" style="position:absolute; top:2px; bottom:2px; left:2px; width:44px; border-radius:9999px; background:var(--btn-bg); transform:{{ blobTransform }}; animation:{{ blobAnim }}; will-change:transform; pointer-events:none;"></span>
        <span style="position:relative; z-index:1; font-family:var(--font-body); font-size:12px; font-weight:600; width:44px; padding:5px 0; text-align:center; border-radius:9999px; color:{{ viColor }}; transition:color .35s ease .1s;">VI</span>
        <span style="position:relative; z-index:1; font-family:var(--font-body); font-size:12px; font-weight:600; width:44px; padding:5px 0; text-align:center; border-radius:9999px; color:{{ enColor }}; transition:color .35s ease .1s;">EN</span>
      </button>
      <a href="Home.dc.html#contact" style="display:inline-flex; align-items:center; font-size:14px; font-weight:600; color:var(--btn-text); background:var(--btn-bg); border-radius:9999px; padding:10px 20px; min-width:118px; justify-content:center;" style-hover="background:var(--btn-hover);">{{ t.ctaGhost }}</a>
    </div>
  </div>
</nav>

<main style="max-width:1280px; margin:0 auto; padding:64px 32px 80px; display:flex; flex-direction:column; gap:48px;">
  <header data-screen-label="Ads hero" style="display:flex; flex-direction:column; gap:16px;">
    <a href="Home.dc.html#projects" style="font-size:14px;">← {{ t.back }}</a>
    <h1 style="margin:0; font-family:var(--font-display); font-weight:400; font-size:56px; line-height:1.1; letter-spacing:-0.036em; color:var(--text); max-width:720px; min-height:2.2em;">Ads & <em style="font-family:var(--font-display-em); font-style:italic; font-weight:400;">Marketing</em></h1>
    <p style="margin:0; font-size:16px; line-height:1.6; color:var(--body); max-width:520px; min-height:3.2em; text-wrap:pretty;">{{ t.sub }}</p>
  </header>

  <section data-screen-label="Three doors" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:24px;">
    <sc-for list="{{ doors }}" as="d" hint-placeholder-count="3">
      <a href="{{ d.href }}" class="wwd-card" style="position:relative; display:block; border-radius:24px; overflow:hidden; background:var(--card); text-decoration:none;">
        <div class="wwd-visual" style="height:640px; background:var(--deep); display:flex; align-items:center; justify-content:center;">
          <span style="font-size:12px; font-weight:500; color:var(--tag); letter-spacing:0.04em;">{{ d.media }}</span>
        </div>
        <div style="position:absolute; left:0; right:0; bottom:0; padding:24px; display:flex; justify-content:space-between; align-items:flex-end; background:linear-gradient(transparent, var(--grad));">
          <span style="font-size:20px; font-weight:600; color:var(--text); letter-spacing:-0.01em;">{{ d.name }}</span>
          <span class="wwd-cta" style="font-size:14px; color:var(--text);">{{ t.enter }} →</span>
        </div>
      </a>
    </sc-for>
  </section>
</main>

<footer data-screen-label="Footer" style="border-top:1px solid var(--footer-line); background:var(--footer-bg);">
  <div style="max-width:1280px; margin:0 auto; padding:64px 32px 40px; display:grid; grid-template-columns:2fr 1fr 1fr; gap:48px;">
    <div style="display:flex; flex-direction:column; gap:16px;">
      <img src="uploads/bf517465-2789-4e72-8f3b-91faeedda607.png" alt="Esmery" style="height:85px; width:509px; max-width:100%; object-fit:contain; object-position:left; filter:var(--logo-filter);">
      <p style="margin:0; font-size:14px; line-height:1.6; color:var(--tag); max-width:300px; min-height:3.2em; text-wrap:pretty;">{{ t.footerTagline }}</p>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <span style="font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--faint);">{{ t.footerLinksTitle }}</span>
      <sc-for list="{{ navLinks }}" as="lnk" hint-placeholder-count="5">
        <a href="{{ lnk.href }}" style="font-size:14px;">{{ lnk.label }}</a>
      </sc-for>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px;">
      <span style="font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--faint);">{{ t.footerSocialTitle }}</span>
      <sc-for list="{{ socials }}" as="s" hint-placeholder-count="4">
        <a href="{{ s.href }}" style="font-size:14px;">{{ s.label }}</a>
      </sc-for>
    </div>
  </div>
  <div style="max-width:1280px; margin:0 auto; padding:0 32px 32px;">
    <span style="font-size:12px; color:var(--faint);">{{ t.rights }}</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;vi&quot;,&quot;options&quot;:[&quot;vi&quot;,&quot;en&quot;],&quot;tsType&quot;:&quot;'vi' | 'en'&quot;,&quot;section&quot;:&quot;Language&quot;},&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;'light' | 'dark'&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  state = { lang: localStorage.getItem('esm-lang') ?? this.props.defaultLang ?? 'vi', langAnimated: false, theme: localStorage.getItem('esm-theme') ?? this.props.defaultTheme ?? 'light' };

  componentDidMount() { document.body.dataset.esmTheme = this.state.theme; }

  componentDidUpdate() { document.body.dataset.esmTheme = this.state.theme; }

  renderVals() {
    const lang = this.state.lang;
    const S = {
      vi: {
        ctaGhost: 'Liên hệ', ctaPrimary: 'Bắt đầu', back: 'Trang chủ', enter: 'Vào xem',
        sub: 'Ba cánh cửa, ba thế giới — chọn một để bước vào.',
        footerTagline: 'Studio thiết kế & marketing sáng tạo tại Việt Nam.',
        footerLinksTitle: 'Điều hướng', footerContactTitle: 'Liên hệ', footerSocialTitle: 'Mạng xã hội',
        city: 'TP. Hồ Chí Minh, Việt Nam',
        rights: '© 2026 Esmery.',
        nav: ['Trang chủ', 'Về chúng tôi', 'Liên hệ'],
        doors: ['Chiến dịch', 'Video AI', 'Tự động hóa']
      },
      en: {
        ctaGhost: 'Contact', ctaPrimary: 'Get started', back: 'Home', enter: 'Enter',
        sub: 'Three doors, three worlds — pick one and step inside.',
        footerTagline: 'A creative design & marketing studio based in Vietnam.',
        footerLinksTitle: 'Navigate', footerContactTitle: 'Contact', footerSocialTitle: 'Social',
        city: 'Ho Chi Minh City, Vietnam',
        rights: '© 2026 Esmery.',
        nav: ['Home', 'About', 'Contact'],
        doors: ['Campaign', 'AI Video', 'Automation']
      }
    };
    const t = S[lang];
    return {
      t,
      socials: [
        { label: 'Instagram', href: '#' },
        { label: 'Behance', href: '#' },
        { label: 'Facebook', href: '#' },
        { label: 'TikTok', href: '#' }
      ],
      doors: t.doors.map((name, i) => ({
        name,
        href: ['Campaign.dc.html', 'AI-Video.dc.html', 'Automation.dc.html'][i],
        media: ['Vertical image / video', 'Vertical video', 'Vertical image / video'][i]
      })),
      navLinks: t.nav.map((label, i) => ({ label, href: ['Home.dc.html', 'About.dc.html', 'Home.dc.html#contact'][i] })),
      toggleTheme: () => this.setState(s => { const theme = s.theme === 'light' ? 'dark' : 'light'; localStorage.setItem('esm-theme', theme); return { theme }; }),
      themeIcon: this.state.theme === 'light' ? '☾' : '☀',
      toggleLang: () => this.setState(s => { const lang = s.lang === 'vi' ? 'en' : 'vi'; localStorage.setItem('esm-lang', lang); return { lang, langAnimated: true }; }),
      langToggleLabel: lang === 'vi' ? 'Switch to English' : 'Chuyển sang tiếng Việt',
      blobTransform: lang === 'vi' ? 'translateX(0)' : 'translateX(46px)',
      blobAnim: this.state.langAnimated ? (lang === 'en' ? 'esm-liq-en 520ms cubic-bezier(0.22, 1, 0.36, 1) both' : 'esm-liq-vi 520ms cubic-bezier(0.22, 1, 0.36, 1) both') : 'none',
      viColor: lang === 'vi' ? 'var(--btn-text)' : 'var(--body)',
      enColor: lang === 'en' ? 'var(--btn-text)' : 'var(--body)'
    };
  }
}
</script>
</body>
</html>
